[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kopi-cli"
version = "0.1.0"
description = "CLI for managing the Kopi Tools platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arquitechthor", email = "guzman6001@gmail.com" }]
keywords = ["kopi", "cli", "devtools"]

dependencies = [
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
kopi = "kopi_cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kopi_cli*"]
